name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  php-compatibility:
    name: PHP 7.4 Compatibility Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
          coverage: none
      
      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress
      
      - name: Check PHP 7.4 Compatibility
        run: |
          vendor/bin/phpcs --standard=PHPCompatibility --runtime-set testVersion 7.4 ./src ./codehaveli-bitly-url-shortener.php --extensions=php --report=full
      
      - name: Check PHP Syntax
        run: |
          php -l codehaveli-bitly-url-shortener.php
          find src -name "*.php" -exec php -l {} \;
      
      - name: Run PHPCS (WordPress Coding Standards)
        run: vendor/bin/phpcs --standard=phpcs.xml

  php-versions:
    name: Test on PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '7.4'
          - '8.0'
          - '8.1'
          - '8.2'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer
          coverage: none
      
      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress
      
      - name: Validate PHP syntax
        run: |
          php -l codehaveli-bitly-url-shortener.php
          find src -name "*.php" -exec php -l {} \;
      
      - name: Check PHP version compatibility
        run: |
          echo "Testing on PHP ${{ matrix.php-version }}"
          php -v
